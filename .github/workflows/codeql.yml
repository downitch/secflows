name: CodeQL

on:
  workflow_call:
  workflow_dispatch:

jobs:
  analyze:
    name: CodeQL Analysis
    runs-on: ubuntu-latest

    permissions:
      security-events: write
      contents: read
      actions: read

    strategy:
      fail-fast: false
      matrix:
        language:
          - javascript
          - python
          - go
          - java

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        if: matrix.language == 'java'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}

      - name: Build Java (settlement service)
        if: matrix.language == 'java'
        working-directory: services/settlement
        run: mvn -B -q clean package -DskipTests

      - name: Autobuild (non-Java languages)
        if: matrix.language != 'java'
        uses: github/codeql-action/autobuild@v3

      - name: Analyze
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"
          upload: false
          upload-database: false

      - name: Copy SARIF to Unified Security Results Folder
        if: always()
        run: |
          mkdir -p security-results
          cp ../results/${{ matrix.language }}.sarif security-results/codeql-${{ matrix.language }}.sarif

      - name: Save Security Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: codeql-${{ matrix.language }}-sarif
          path: security-results/codeql-${{ matrix.language }}.sarif
          retention-days: 7
