name: CodeQL

on:
  workflow_call:
  workflow_dispatch:

jobs:
  analyze:
    name: CodeQL Analysis
    runs-on: ubuntu-latest

    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        language:
          - javascript
          - python
          - go

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Analyze
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"
          upload: false

      - name: Copy SARIF to Unified Security Results Folder
        if: always()
        run: |
          mkdir -p security-results
          cp ../results/${{ matrix.language }}.sarif security-results/codeql-${{ matrix.language }}.sarif

      - name: Save Security Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: codeql-${{ matrix.language }}-sarif
          path: security-results/codeql-${{ matrix.language }}.sarif
          retention-days: 7
