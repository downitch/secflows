name: SAST Triage

on:
  workflow_call:
    inputs:
      mode:
        description: "report-only (never fails the build) or enforce (fails on BLOCK findings)"
        type: string
        default: report-only
      block-min-score:
        type: number
        default: 7.0
      warn-min-score:
        type: number
        default: 4.0

jobs:
  triage:
    name: Consolidate SAST findings
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: write
      actions: read

    steps:
      - name: Checkout triage tooling
        uses: actions/checkout@v4
        with:
          repository: downitch/secflows
          path: secflows
          sparse-checkout: |
            scripts

      - name: Download all SARIF artifacts from this run
        uses: actions/download-artifact@v4
        with:
          path: sarif-artifacts

      - name: Run triage
        id: run-triage
        run: |
          set +e
          python3 secflows/scripts/sast_triage.py \
            --sarif-glob "sarif-artifacts/**/*.sarif" \
            --mode "${{ inputs.mode }}" \
            --block-min-score "${{ inputs.block-min-score }}" \
            --warn-min-score "${{ inputs.warn-min-score }}" \
            --output-json triage-report.json
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
          set -e

      - name: Post or update PR comment
        if: github.event_name == 'pull_request' && hashFiles('triage-report.json') != ''
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = JSON.parse(fs.readFileSync('triage-report.json', 'utf8'));
            const icons = { BLOCK: '🚫', WARN: '⚠️', ASYNC: '🕓' };

            let body = `## SAST Triage Report\n\n`;
            body += `**Findings:** ${report.findings.length} unique location(s) from `
                  + `${report.raw_finding_count} raw result(s) across `
                  + `${report.sarif_files_scanned.length} SARIF file(s)\n\n`;
            body += `| Verdict | Count |\n|---|---|\n`;
            for (const v of ['BLOCK', 'WARN', 'ASYNC']) {
              body += `| ${icons[v]} ${v} | ${report.summary[v] ?? 0} |\n`;
            }
            body += `\n`;

            if (report.findings.length === 0) {
              body += `_No findings to report._\n`;
            } else {
              body += `| | File | Line | Rule | Tools | Message |\n|---|---|---|---|---|---|\n`;
              for (const f of report.findings) {
                const tools = f.tools.join(', ');
                let msg = f.message.replace(/\|/g, '\\|').replace(/\n/g, ' ');
                if (msg.length > 140) msg = msg.slice(0, 137) + '...';
                body += `| ${icons[f.verdict]} | \`${f.file}\` | ${f.line ?? ''} | `
                      + `\`${f.rule_id}\` | ${tools} | ${msg} |\n`;
              }
            }

            const marker = '<!-- sast-triage-report -->';
            const fullBody = `${marker}\n${body}`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body && c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body: fullBody,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: fullBody,
              });
            }

      - name: Upload triage report as artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sast-triage-report
          path: triage-report.json
          retention-days: 30
          if-no-files-found: warn

      - name: Enforce gate
        if: inputs.mode == 'enforce'
        run: |
          case "${{ steps.run-triage.outputs.exit_code }}" in
            0)
              echo "SAST triage passed — no BLOCK-tier findings."
              ;;
            1)
              echo "::error::Blocking findings detected. See the SAST Triage Report artifact or PR comment."
              exit 1
              ;;
            2)
              echo "::error::SAST scan did not produce results (no SARIF found). Failing closed rather than merging unscanned code — see workflow run logs."
              exit 1
              ;;
            *)
              echo "::error::sast_triage.py exited unexpectedly (code ${{ steps.run-triage.outputs.exit_code }}). Failing closed."
              exit 1
              ;;
          esac
