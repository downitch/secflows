name: Semgrep SAST

on:
  workflow_call:
    inputs:
      mode:
        description: "'full' scans the entire checkout; 'diff' scans only what changed vs. the PR base"
        type: string
        default: full

jobs:
  semgrep:
    name: Semgrep Analysis
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep:1.177.0

    permissions:
      security-events: write
      contents: read
      actions: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history required to resolve --baseline-ref

      - name: Run Semgrep Scan
        env:
          SEMGREP_MODE: ${{ inputs.mode }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          mkdir -p security-results
          if [ "$SEMGREP_MODE" = "diff" ] && [ -n "$BASE_SHA" ]; then
            echo "Diff-aware scan against base $BASE_SHA"
            semgrep scan \
              --config=p/default \
              --config=p/security-audit \
              --baseline-ref "$BASE_SHA" \
              --sarif \
              --output=security-results/semgrep.sarif \
              --no-error
          else
            echo "Full scan"
            semgrep scan \
              --config=p/default \
              --config=p/security-audit \
              --sarif \
              --output=security-results/semgrep.sarif \
              --no-error
          fi

      - name: Upload to GitHub Security (GHAS)
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: security-results/semgrep.sarif

      - name: Save Unified Security Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: semgrep-results-sarif
          path: security-results/semgrep.sarif
          retention-days: 7
