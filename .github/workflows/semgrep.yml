name: Semgrep SAST

on:
  workflow_call:
  workflow_dispatch:

jobs:
  semgrep:
    name: Semgrep Analysis
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Python & Semgrep
        run: |
          python -m pip install --upgrade pip
          pip install semgrep

      - name: Run Semgrep Scan
        run: |
          mkdir -p security-results
          semgrep scan \
            --config=p/default \
            --config=p/security-audit \
            --sarif \
            --output=security-results/semgrep.sarif \
            --no-error

      - name: Soft-upload to GitHub Security (GHAS)
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        continue-on-error: true
        with:
          sarif_file: security-results/semgrep.sarif

      - name: Save Unified Security Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-results
          path: security-results/
          retention-days: 7
