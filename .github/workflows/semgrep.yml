name: Semgrep SAST

on:
  workflow_call:
  workflow_dispatch:

jobs:
  semgrep:
    name: Semgrep Analysis
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep:1.177.0

    permissions:
      security-events: write
      contents: read
      actions: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Semgrep Scan
        run: |
          mkdir -p security-results
          semgrep scan \
            --config=p/default \
            --config=p/security-audit \
            --sarif \
            --output=security-results/semgrep.sarif \
            --no-error

      - name: Upload to GitHub Security (GHAS)
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: security-results/semgrep.sarif

      - name: Save Unified Security Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: semgrep-results-sarif
          path: security-results/semgrep.sarif
          retention-days: 7
